<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Puesto Lidia - Venta</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff; height: 100vh; display: flex; flex-direction: column; }
        .top-header { background-color: #5b8df2; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; }
        .sub-header { background-color: #3e4a5c; color: white; padding: 10px 20px; font-size: 1.2rem; font-weight: bold; }
        .main-container { display: flex; flex: 1; padding: 15px; gap: 15px; overflow: hidden; }
        .col-izq { flex: 6; display: flex; flex-direction: column; gap: 15px; border: 2px solid #ccc; border-radius: 10px; padding: 15px; background-color: #f9f9f9; }
        .buscador { width: 100%; }
        .buscador input { width: 100%; border-radius: 8px; padding: 15px; font-size: 1.2rem; border: 2px solid #ccc; box-sizing: border-box; }
        .grid-categorias { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; flex: 1; overflow-y: auto; border: 2px solid #ccc; border-radius: 10px; padding: 10px; background-color: white; }

        .btn-categoria {
            height: 80px;
            border-radius: 10px !important;
            background-color: white !important;
            border: 2px solid #ccc !important;
            color: #333 !important;
            white-space: normal !important;
            font-size: 0.9rem !important;
            font-weight: bold !important;
        }

        .col-der { flex: 4; display: flex; flex-direction: column; gap: 10px; border: 2px solid #ccc; border-radius: 10px; padding: 15px; background-color: #f9f9f9; }
        .caja-ticket { flex: 1; border: 2px solid #ccc; border-radius: 8px; background-color: white; overflow: auto; }
        .panel-totales { border: 2px solid #ccc; background-color: white; padding: 15px; font-size: 1.5rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .btn-cobrar { width: 100%; height: 60px; font-size: 1.5rem !important; font-weight: bold !important; }
        .footer-bar { background-color: #5b8df2; padding: 10px 20px; display: flex; align-items: center; }
        .btn-volver { background-color: transparent !important; border: none !important; color: white !important; font-size: 2rem !important; }
        .btn-cantidad { width: 25px !important; height: 25px !important; }
    </style>
</h:head>

<h:body>
    <p:growl id="mensajes" showDetail="true" life="4000">
        <p:autoUpdate />
    </p:growl>

    <div class="top-header">
        <span>PUESTO LIDIA</span>
        <span>USUARIO <i class="pi pi-user"></i></span>
    </div>
    <div class="sub-header">Venta</div>

    <h:form id="formVenta" style="display: contents;">
        <p:focus for="inputBusqueda" />

        <p:hotkey bind="F1" update=":formCobro" oncomplete="PF('wvModalCobro').show();" />
        <p:hotkey bind="F3" action="#{ventaBean.eliminarProductoSeleccionado}" update="tablaTicket panelTotales :mensajes" />

        <div class="main-container">
            <div class="col-izq">
                <div class="buscador">
                    <p:inputText id="inputBusqueda" value="#{ventaBean.textoBusqueda}" placeholder="Escanea el código de barras o ingresa el nombre...">
                        <p:ajax event="change" listener="#{ventaBean.buscarAgregarProducto}" update="tablaTicket panelTotales @this" />
                    </p:inputText>
                </div>

                <div class="grid-categorias">
                    <p:commandButton value="Refrescos y Bebidas" action="#{ventaBean.cargarCategoria('11')}"
                                     update=":formModalCategoria" oncomplete="PF('wvModalCategoria').show();"
                                     styleClass="btn-categoria" />

                    <p:commandButton value="Snacks" action="#{ventaBean.cargarCategoria('12')}"
                                     update=":formModalCategoria" oncomplete="PF('wvModalCategoria').show();"
                                     styleClass="btn-categoria" />

                    <p:commandButton value="Comida" action="#{ventaBean.cargarCategoria('13')}"
                                     update=":formModalCategoria" oncomplete="PF('wvModalCategoria').show();"
                                     styleClass="btn-categoria" />

                    <p:commandButton type="button" styleClass="btn-categoria" />
                    <p:commandButton type="button" styleClass="btn-categoria" />
                    <p:commandButton type="button" styleClass="btn-categoria" />
                    <p:commandButton type="button" styleClass="btn-categoria" />
                    <p:commandButton type="button" styleClass="btn-categoria" />
                    <p:commandButton type="button" styleClass="btn-categoria" />
                    <p:commandButton type="button" styleClass="btn-categoria" />
                </div>
            </div>

            <div class="col-der">
                <div class="caja-ticket">
                    <p:dataTable id="tablaTicket" value="#{ventaBean.listaCompra}" var="item"
                                 selectionMode="single" selection="#{ventaBean.detalleSeleccionado}" rowKey="#{item.idProducto.idProducto}"
                                 emptyMessage="Ticket vacío. Escanea un producto para comenzar."
                                 scrollable="true" scrollHeight="flex">

                        <p:column headerText="ID" width="60">
                            <h:outputText value="#{item.idProducto.idProducto}" />
                        </p:column>

                        <p:column headerText="Concepto">
                            <h:outputText value="#{item.idProducto.nombre}" />
                        </p:column>

                        <p:column headerText="Cant." width="90" style="text-align: center;">
                            <p:commandButton icon="pi pi-minus" action="#{ventaBean.disminuirCantidad(item)}"
                                             update=":formVenta:tablaTicket :formVenta:panelTotales"
                                             styleClass="ui-button-danger ui-button-outlined btn-cantidad" />
                            <h:outputText value=" #{item.cantidad} " style="font-weight: bold; margin: 0 5px;" />
                            <p:commandButton icon="pi pi-plus" action="#{ventaBean.aumentarCantidad(item)}"
                                             update=":formVenta:tablaTicket :formVenta:panelTotales"
                                             styleClass="ui-button-success ui-button-outlined btn-cantidad" />
                        </p:column>

                        <p:column headerText="Precio" width="70" style="text-align: right;">
                            <h:outputText value="#{item.precioUnitario}">
                                <f:convertNumber type="currency" currencySymbol="$" locale="en_US" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Importe" width="70" style="text-align: right; font-weight: bold;">
                            <h:outputText value="#{item.importe}">
                                <f:convertNumber type="currency" currencySymbol="$" locale="en_US" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </div>

                <div style="padding: 5px 0;">
                    <p:selectBooleanCheckbox value="#{ventaBean.tipoVentaCredito}" itemLabel="Marcar como Venta a Crédito" />
                </div>

                <p:outputPanel id="panelTotales" class="panel-totales">
                    <span>TOTAL:</span>
                    <span style="color: #d32f2f;">
                        <h:outputText value="#{ventaBean.totalCompra}">
                            <f:convertNumber type="currency" currencySymbol="$" locale="en_US" maxFractionDigits="2"/>
                        </h:outputText>
                    </span>
                </p:outputPanel>

                <p:commandButton value="COBRAR (F1)" icon="pi pi-money-bill"
                                 styleClass="ui-button-success btn-cobrar"
                                 process="@this" update=":formCobro"
                                 oncomplete="PF('wvModalCobro').show();" />
            </div>
        </div>

        <div class="footer-bar">
            <p:commandButton icon="pi pi-arrow-left" type="button" styleClass="btn-volver" />
            <span style="color: white; margin-left: 20px;">* Usa F1 para cobrar y F3 para eliminar el producto seleccionado</span>
        </div>
    </h:form>

    <p:dialog widgetVar="wvModalCobro" header="Confirmar Pago" modal="true" width="450"
              resizable="false" closeOnEscape="true" showEffect="fade" hideEffect="fade">
        <h:form id="formCobro">
            <div class="ui-fluid">
                <div style="text-align: center; margin-bottom: 20px;">
                    <h:outputText value="Total a pagar:" style="font-size: 1.2rem; display: block;" />
                    <h:outputText value="#{ventaBean.totalCompra}" style="font-size: 3rem; font-weight: bold; color: #d32f2f;">
                        <f:convertNumber type="currency" currencySymbol="$" locale="en_US" maxFractionDigits="2"/>
                    </h:outputText>
                </div>

                <div style="margin-bottom: 20px;">
                    <p:outputLabel value="Monto Recibido:" style="font-weight: bold;" />
                    <p:inputNumber value="#{ventaBean.montoRecibido}" symbol="$ " decimalPlaces="2"
                                   decimalSeparator="." thousandSeparator=","
                                   minValue="0" style="font-size: 1.5rem;" inputStyle="font-size: 1.5rem; text-align: center;">
                        <p:ajax event="change" listener="#{ventaBean.calcularCambio}" update="txtCambio" />
                    </p:inputNumber>
                </div>

                <div style="text-align: center; margin-bottom: 20px; background-color: #f1f8e9; padding: 15px; border-radius: 8px; border: 1px solid #c5e1a5;">
                    <h:outputText value="Cambio a entregar:" style="font-size: 1.2rem; display: block;" />
                    <h:outputText id="txtCambio" value="#{ventaBean.cambio}" style="font-size: 2.5rem; font-weight: bold; color: #388e3c;">
                        <f:convertNumber type="currency" currencySymbol="$" locale="en_US" maxFractionDigits="2"/>
                    </h:outputText>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between;">
                <p:commandButton value="Cancelar" type="button" onclick="PF('wvModalCobro').hide();"
                                 styleClass="ui-button-secondary ui-button-flat" style="width: 48%; font-weight: bold;" />

                <p:commandButton value="Aceptar" action="#{ventaBean.finalizarVenta}"
                                 update=":formVenta :mensajes" oncomplete="if (!args.validationFailed) PF('wvModalCobro').hide();"
                                 styleClass="ui-button-success" style="width: 48%; font-weight: bold;" />
            </div>
        </h:form>
    </p:dialog>

    <p:dialog widgetVar="wvModalCategoria" header="Seleccionar Producto" modal="true" width="600"
              resizable="false" closeOnEscape="true" showEffect="fade" hideEffect="fade">
        <h:form id="formModalCategoria">

            <p:dataTable value="#{ventaBean.productosCategoria}" var="prod"
                         emptyMessage="No hay productos registrados en esta categoría."
                         scrollable="true" scrollHeight="300">

                <p:column headerText="ID" width="80">
                    <h:outputText value="#{prod.idProducto}" />
                </p:column>

                <p:column headerText="Producto">
                    <h:outputText value="#{prod.nombre}" />
                </p:column>

                <p:column headerText="Stock" width="60" style="text-align: center;">
                    <h:outputText value="#{prod.cantidad}" style="font-weight: bold; color: #1976d2;" />
                </p:column>

                <p:column headerText="Precio" width="80" style="text-align: right;">
                    <h:outputText value="#{prod.precio}">
                        <f:convertNumber type="currency" currencySymbol="$" locale="en_US" maxFractionDigits="2"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Agregar" width="80" style="text-align: center;">
                    <p:commandButton icon="pi pi-cart-plus" action="#{ventaBean.agregarDesdeCategoria(prod)}"
                                     update=":formVenta:tablaTicket :formVenta:panelTotales :mensajes"
                                     oncomplete="PF('wvModalCategoria').hide();"
                                     styleClass="ui-button-success ui-button-raised ui-button-rounded" />
                </p:column>

            </p:dataTable>

        </h:form>
    </p:dialog>

</h:body>
</html>
